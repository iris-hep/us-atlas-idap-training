[workspace]
channels = ["conda-forge"]
name = "columnar"
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]
version = "0.1.0"

[tasks.lab]
description = "Launch Jupyter Lab"
cmd = "jupyter lab"

[tasks.start]
depends-on = ["lab"]

[dependencies]
numpy = ">=2.5.1,<3"
awkward = ">=2.11.0,<3"
uproot = ">=5.7.5,<6"
vector = ">=1.8.1,<2"
hist = ">=2.10.1,<3"
matplotlib = ">=3.11.1,<4"
jupyterlab = ">=4.6.2,<5"
notebook = ">=7.6.1,<8"
ipywidgets = ">=8.1.8,<9"
