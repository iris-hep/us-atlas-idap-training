[workspace]
channels = ["conda-forge"]
name = "sample-game"
platforms = ["linux-64", "osx-64", "osx-arm64"]
version = "0.1.0"

[tasks.lab]
description = "Launch Jupyter Lab"
cmd = "jupyter lab"

[tasks.start]
depends-on = ["lab"]

[dependencies]
coffea = ">=2026.7.0,<2027"
awkward = ">=2.11.0,<3"
uproot = ">=5.7.5,<6"
hist = ">=2.10.1,<3"
mplhep = ">=1.3.1,<2"
matplotlib = ">=3.11.1,<4"
# numba 0.66 (pulled in transitively by coffea 2026.7) requires numpy <2.5, so
# numpy resolves to 2.4.x on Python 3.14; pinning >=2.5 is unsolvable.
numpy = ">=2.4,<2.5"
xrootd = ">=6.1.0,<7"
fsspec-xrootd = ">=0.5.5,<0.6"
jupyterlab = ">=4.6.2,<5"
notebook = ">=7.6.1,<8"
ipywidgets = ">=8.1.8,<9"
