[workspace]
channels = ["conda-forge"]
name = "sample-game"
platforms = ["linux-64", "osx-64", "osx-arm64"]
version = "0.1.0"

[tasks.lab]
description = "Launch Jupyter Lab"
cmd = "jupyter lab"

[tasks.start]
depends-on = ["lab"]

[dependencies]
coffea = ">=2026.7.0,<2027"
xrootd = ">=6.1.0,<7"
jupyterlab = ">=4.6.2,<5"
notebook = ">=7.6.1,<8"
ipywidgets = ">=8.1.8,<9"
