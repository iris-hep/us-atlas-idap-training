[workspace]
channels = ["conda-forge"]
name = "stats-tools"
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]
version = "0.1.0"

[tasks.lab]
cmd = "jupyter lab"

[tasks.start]
depends-on = ["lab"]

[dependencies]
cabinetry = ">=0.6.0,<0.7"
uproot = ">=5.7.5,<6"
hist = ">=2.10.1,<3"
dask = ">=2026.7.1,<2027"
distributed = ">=2026.7.1,<2027"
notebook = ">=7.6.1,<8"
jupyterlab = ">=4.6.2,<5"
